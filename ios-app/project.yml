# Dibaca XcodeGen (`xcodegen generate`) di GitHub Actions macOS untuk membuat PastiCuan.xcodeproj.
# Repo ini dikembangkan dari Windows, jadi .xcodeproj tidak di-commit.
name: PastiCuan
options:
  bundleIdPrefix: id.pasticuan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  PastiCuanCore:
    path: PastiCuanCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  PastiCuan:
    type: application
    platform: iOS
    sources:
      - path: PastiCuan
    dependencies:
      - package: PastiCuanCore
    info:
      path: PastiCuan/Info.plist
      properties:
        CFBundleDisplayName: Pasti Cuan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Kanvas
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: id.pasticuan.wallet.auth
            CFBundleURLSchemes: [pasticuan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.pasticuan.wallet
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Manual
