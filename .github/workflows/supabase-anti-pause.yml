name: Supabase Anti-Pause Ping (NF-07)

on:
  schedule:
    # Jalankan setiap hari jam 09.00 WIB (02.00 UTC)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST API Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/pengaturan_pool?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $status"
          test "$status" -eq 200 -o "$status" -eq 401 -o "$status" -eq 403
