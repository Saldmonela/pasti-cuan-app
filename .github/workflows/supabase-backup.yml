name: Supabase Weekly DB Backup (NF-06)

on:
  schedule:
    # Setiap Minggu jam 04.00 WIB (Sabtu 21.00 UTC)
    - cron: "0 21 * * 6"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: v2.107.0
      - name: Dump dan enkripsi backup database (AES-256 + PBKDF2)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "ERROR: BACKUP_PASSPHRASE secret wajib diisi agar dump tidak terunggah tanpa enkripsi." >&2
            exit 1
          fi
          mkdir -p backups encrypted
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" -f backups/schema.sql
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" --data-only -f backups/data.sql
          # Cara dekripsi lokal (ambil BACKUP_PASSPHRASE dari .env.local):
          # openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:BACKUP_PASSPHRASE -in pasti-cuan-backup.tar.gz.enc | tar -xz
          tar -czf - -C backups schema.sql data.sql | \
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE \
            -out encrypted/pasti-cuan-backup.tar.gz.enc
          rm -rf backups
      - name: Simpan backup terenkripsi sebagai artifact workflow
        uses: actions/upload-artifact@v4
        with:
          name: pasti-cuan-db-backup-enc-${{ github.run_id }}
          path: encrypted/pasti-cuan-backup.tar.gz.enc
          retention-days: 90
